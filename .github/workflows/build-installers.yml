name: Build Coodi Installers

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coodi-installers-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.21.0"

jobs:
  build:
    name: Build ${{ matrix.name }}
    if: github.repository == 'mubashirhassanpk/coodi' || github.repository == 'imubashirhassanpk/coodi'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64 NSIS
            artifact: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            shell: pwsh
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - name: Check out Coodi
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Rust nightly and target
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}
          components: rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          cache-on-failure: true

      - name: Install dependencies
        shell: bash
        run: pnpm install --ignore-scripts --config.block-exotic-subdeps=false

      - name: Configure Perl for Windows OpenSSL builds
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $perlDir = "C:\Strawberry\perl\bin"
          $perlExe = Join-Path $perlDir "perl.exe"
          if (-not (Test-Path $perlExe)) {
            choco install strawberryperl -y --no-progress
          }
          if (-not (Test-Path $perlExe)) {
            throw "Strawberry Perl was not found after installation."
          }
          $perlDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "PERL=$perlExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Import Windows Authenticode certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            "WINDOWS_AUTHENTICODE_SIGNING=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "Windows signing secrets are not configured; building an unsigned installer."
            exit 0
          }

          "WINDOWS_AUTHENTICODE_SIGNING=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\coodi-signing" | Out-Null
          $certificateText = "$env:RUNNER_TEMP\coodi-signing\certificate.txt"
          $certificatePath = "$env:RUNNER_TEMP\coodi-signing\certificate.pfx"
          Set-Content -NoNewline -Path $certificateText -Value $env:WINDOWS_CERTIFICATE_BASE64
          certutil -decode $certificateText $certificatePath | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "Unable to decode the Windows certificate." }

          $password = ConvertTo-SecureString `
            -String $env:WINDOWS_CERTIFICATE_PASSWORD `
            -AsPlainText -Force
          $cert = Import-PfxCertificate `
            -FilePath $certificatePath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $password |
            Select-Object -First 1
          if (-not $cert) { throw "Unable to import the Windows certificate." }

          "WINDOWS_CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "WINDOWS_DIGEST_ALGORITHM=sha256" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          if ($env:WINDOWS_TIMESTAMP_URL) {
            "WINDOWS_TIMESTAMP_URL=$env:WINDOWS_TIMESTAMP_URL" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            "WINDOWS_TIMESTAMP_URL=http://time.certum.pl/" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Prepare Windows signing configuration
        if: runner.os == 'Windows'
        shell: bash
        run: node scripts/release/packaging/windows/prepare-signing.mjs

      - name: Build Windows NSIS installer
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/tauri build \
            --target "${{ matrix.target }}" \
            --bundles "${{ matrix.bundles }}"

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: coodi-${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/bundle
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish Windows GitHub Release asset
    if: startsWith(github.ref, 'refs/tags/v') && (github.repository == 'mubashirhassanpk/coodi' || github.repository == 'imubashirhassanpk/coodi')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          pattern: coodi-*
          path: release-assets
          merge-multiple: true

      - name: Collect Windows installer files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          find release-assets -type f \( -name '*.exe' -o -name '*.msi' \) -print -exec cp {} release-publish/ \;
          test -n "$(find release-publish -type f -print -quit)"
          find release-publish -type f -maxdepth 1 -print

      - name: Publish Windows release
        uses: softprops/action-gh-release@v2
        with:
          files: release-publish/*
          generate_release_notes: true
          fail_on_unmatched_files: true
